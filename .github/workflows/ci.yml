name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks, coverage, browser and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm audit --audit-level=high
      - run: npm run check:runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run api:openapi
      - run: git diff --exit-code -- apps/api/openapi.json
      - run: npm run test:integration -- --coverage
      - run: npm run eval -- --config rules --split dev
      - run: npm run eval -- --config hybrid --provider fake --split dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: SOCHAT_WEB_PORT=18080 docker compose --env-file /dev/null -p sochat-ci up --build --wait
      - run: node docker/smoke.mjs
      - run: SOCHAT_COMPOSE_FIXTURE=sochat-ci npx playwright test --config config/testing/playwright.compose.config.ts
      - run: docker compose --env-file /dev/null -p sochat-release-ci -f compose.release-test.yaml up --build --wait
      - run: npx playwright test --config config/testing/playwright.release.config.ts
      - if: always()
        run: docker compose --env-file /dev/null -p sochat-release-ci -f compose.release-test.yaml down --volumes --remove-orphans
      - if: always()
        run: docker compose --env-file /dev/null -p sochat-ci down --volumes --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-reports
          path: |
            eval/results/rules-dev.*
            eval/results/hybrid-fake-dev.*
            coverage/
            test-results/
          retention-days: 14
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/scan:ro"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --exit-code 1 --skip-dirs .git /scan
