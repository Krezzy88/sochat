name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm audit --audit-level=high
      - run: npm run check:runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run api:openapi
      - run: git diff --exit-code -- apps/api/openapi.json
      - run: npm run test:integration
      - run: npm run eval -- --config rules --split dev
      - run: npm run eval -- --config hybrid --provider fake --split dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
