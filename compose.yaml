name: sochat-demo
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: sochat_demo
      POSTGRES_USER: sochat_demo
      POSTGRES_PASSWORD: synthetic-local-demo-only
    volumes:
      - demo-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sochat_demo -d sochat_demo']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sochat_demo:synthetic-local-demo-only@db:5432/sochat_demo
      SESSION_SECRET: local-synthetic-demo-session-secret-never-use-publicly
      LLM_PROVIDER: fake
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:${SOCHAT_WEB_PORT:-8080}
      TRUST_PROXY_HOPS: 0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '127.0.0.1:${SOCHAT_WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  demo-db:
